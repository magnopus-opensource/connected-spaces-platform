# This workflow downloads all uploaded install artifacts (postfixed with -install),
# creates individual zip archives for each artifact, and uploads them as a Github release.

name: Upload Releases

on:
  workflow_call:
    inputs:
      release_number:
        type: string
        required: true

      prerelease:
        type: boolean
        required: true
        default: false

jobs:
  upload-release:
    name: Publish Release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
  
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: '*-install'
          path: release-artifacts

      # This script iterates all artifcts that were downloaded in the previous step, and
      # zips them up into a release-assets directory.
      - name: Create release archives
        shell: bash
        run: |
          set -euxo pipefail

          # Create directory for zipped artifacts
          mkdir -p release-assets

          # Iterate all install artifacts and zip them into release-assets dir
          for artifact_dir in release-artifacts/*-install; do
            if [[ ! -d "$artifact_dir" ]]; then
              continue
            fi

            artifact_name="$(basename "$artifact_dir")"
            archive_name="${artifact_name%-install}"

            (
              cd "$artifact_dir"
              zip -r "../../release-assets/${archive_name}.zip" .
            )
          done

          echo "Release assets:"
          ls -lh release-assets

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_number }}
          name: CSP ${{ inputs.release_number }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*.zip