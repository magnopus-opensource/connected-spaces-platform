# This workflow performs the following optional actions:
#  - Builds csp for all desktop platforms
#  - Builds csp for wasm
#  - Builds csp for android
#  - Builds csp for iOS and visionOS
#  - Builds csp using legacy wasm wrapper
#  - Runs csp live tests on Linux
#  - Uploads artifacts to GitHub
#  - Creates a GitHub release
#  - Uploads legacy wasm artifact to NPM
#
# For feature builds, set create_release: false and upload_build_artifacts: true

name: Publish CSP

on:

  workflow_dispatch:
    inputs: &publish_inputs
      skip_tests:
        type: boolean
        description: 'Whether tests should be skipped'
        required: true
        default: false

      gtest_filter:
        description: 'An optional gtest filter to pass to Google Test if running tests'
        type: string
        required: false
        default: "*"
      
      # Setting create_release: false and upload_build_artifacts: true uploads artifacts only, with no release or npm publish made.
      create_release:
        type: boolean
        description: 'Whether a Github release should be created'
        required: true
        default: true

      upload_build_artifacts:
        type: boolean
        description: 'Whether build artifacts should be uploaded (always on when create_release is set)'
        required: true
        default: true

      prerelease:
        type: boolean
        description: 'Whether Github release is marked as a prerelease'
        required: true
        default: false

      release_number:
        type: string
        description: 'Version number of this release'
        required: true

      build_desktop:
        type: boolean
        description: Build desktop packages
        required: true
        default: true

      build_wasm:
        type: boolean
        description: Build modern WASM packages
        required: true
        default: true

      build_android:
        type: boolean
        description: Build Android packages
        required: true
        default: true

      build_ios_visionos:
        type: boolean
        description: Build iOS and visionOS packages
        required: true
        default: true

      build_linux_unreal:
        type: boolean
        description: Build Linux Unreal packages
        required: true
        default: true

  # Same inputs as workflow_dispatch, allows calling from other workflows (e.g. nightly-build.yml)
  workflow_call:
    inputs: *publish_inputs

jobs:
  validate-inputs:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release_number input
        if: inputs.create_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NUMBER: ${{ inputs.release_number }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Releases can only be created from main (got $GITHUB_REF). Untick create_release for a feature build."
            exit 1
          fi
          if [[ "$PRERELEASE" == "true" ]]; then
            pattern='^Nightly-[0-9]{4}-[0-9]{2}-[0-9]{2}$'
            error_msg="Prereleases are only used for nightly builds. Expected: Nightly-YYYY-MM-DD"
          else
            pattern='^[0-9]+\.[0-9]+\.[0-9]+$'
            error_msg="Releases must be major.minor.patch (eg 7.4.0)"
          fi
          if [[ ! "$RELEASE_NUMBER" =~ $pattern ]]; then
            echo "::error::Invalid release_number '$RELEASE_NUMBER'. $error_msg."
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_NUMBER}" >/dev/null 2>&1; then
            echo "::error::Tag '$RELEASE_NUMBER' already exists."
            exit 1
          fi

  desktop:
    needs: validate-inputs
    if: inputs.build_desktop
    uses: ./.github/workflows/desktop-build.yml
    with:
      upload_test_build: ${{ !inputs.skip_tests }}
      upload_install: ${{ inputs.upload_build_artifacts || inputs.create_release }}

  wasm:
    needs: validate-inputs
    if: inputs.build_wasm
    uses: ./.github/workflows/wasm-build.yml
    with:
      upload_install: ${{ inputs.upload_build_artifacts || inputs.create_release }}

  android:
    needs: validate-inputs
    if: inputs.build_android
    uses: ./.github/workflows/android-build.yml
    with:
      upload_install: ${{ inputs.upload_build_artifacts || inputs.create_release }}

  ios-visionos:
    needs: validate-inputs
    if: inputs.build_ios_visionos
    uses: ./.github/workflows/ios-visionos-build.yml
    with:
      upload_install: ${{ inputs.upload_build_artifacts || inputs.create_release }}

  linux-unreal:
    needs: validate-inputs
    if: inputs.build_linux_unreal
    uses: ./.github/workflows/linux-unreal-build.yml
    with:
      upload_install: ${{ inputs.upload_build_artifacts || inputs.create_release }}

  live-desktop-tests:
    if: inputs.build_desktop && !inputs.skip_tests
    uses: ./.github/workflows/live-mcs-tests-run.yml
    secrets: inherit
    needs: desktop
    with:
       gtest_filter: ${{ inputs.gtest_filter }}
  
  upload-releases:
    uses: ./.github/workflows/upload-releases.yml
    with:
      release_number: ${{ inputs.release_number }}
      prerelease: ${{ inputs.prerelease }}

    needs:
    - validate-inputs
    - desktop
    - wasm
    - live-desktop-tests
    - android
    - ios-visionos
    - linux-unreal

    # If a platform is set to run, it should succeed
    if: |
      always() &&
      inputs.create_release &&
      needs.validate-inputs.result == 'success' &&
      (!inputs.build_desktop || needs.desktop.result == 'success') &&
      (!inputs.build_wasm || needs.wasm.result == 'success') &&
      (!inputs.build_android || needs.android.result == 'success') &&
      (!inputs.build_ios_visionos || needs.ios-visionos.result == 'success') &&
      (!inputs.build_linux_unreal || needs.linux-unreal.result == 'success') &&
      (
        inputs.skip_tests ||
        needs.live-desktop-tests.result == 'success'
      )