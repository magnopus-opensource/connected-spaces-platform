name: PR Checks

# This workflow performs the following actions:
#  - Builds all desktop platforms
#  - Uploads the install tree as a workflow artifact
#  - Builds csp as emscripten static lib
#  - Builds csp for android
#  - Builds csp for iOS and visionOS
#  - Runs csp locsl tests on Linux

on:
  pull_request:
    branches:
      - main

jobs:
  desktop:
    uses: ./.github/workflows/desktop-build.yml
    with:
      upload_test_build: true
      upload_install: false
    
  wasm:
    uses: ./.github/workflows/wasm-build.yml
    with:
      upload_install: false
  
  android:
    uses: ./.github/workflows/android-build.yml
    with:
      upload_install: false

  ios-visionos:
    uses: ./.github/workflows/ios-visionos-build.yml
    with:
      upload_install: false

  legacy-wasm:
    uses: ./.github/workflows/legacy-wasm-build.yml
    secrets: inherit
    with:
      upload_package: false
      run_tests: true

      - name: Run Tests
        if: matrix.config.build_type == 'Debug'
        env:
          MCS_X_WAF_BYPASS: ${{ secrets.MCS_BYPASS }}
        shell: bash
        run: |
          cd WasmTesting
          ./run-csp-wasm-tests.cmd