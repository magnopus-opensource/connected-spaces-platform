# This workflow builds, installs, and optionally uploads CSP artifacts for every supported
# combination of wasm build configuration:
#
# [Debug, Release, RelWithDebInfo]
#
# upload_install - If this is true, artifacts will be created for each of the above combinations.
# These are stored and named as follows:
#
# The path generated for this artifact is:
#   install/wasm/{CONFIG_LOWERCASE}
#
# Example:
#   install/wasm/debug
#
# The name generated for this artifact is:
#   wasm-{CONFIG_LOWERCASE}-install
#
# Example:
#   wasm-debug-install
#
# config.preset_prefix - Used to select a CMake preset based on the build type.
# This value is also substituted for {CONFIG_LOWERCASE} to create the artifact path and name shown above.
name: Build Wasm

on:
  workflow_call:
    inputs:
      upload_install:
        description: "If true, the install will be uploaded as an artifact. These artifacts are used for releases."
        type: boolean
        required: false
        default: false

jobs:
  build-wasm:
    name: Build wasm ${{ matrix.config.build_type }}
    runs-on: ubuntu-24.04
    
    env:
      EMSDK_VERSION: 5.0.2
    
    strategy:
      fail-fast: false
      
      matrix:
        config:
          - build_type: Debug
            preset_prefix: debug

          - build_type: Release
            preset_prefix: release

          - build_type: RelWithDebInfo
            preset_prefix: relwithdebinfo

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Ensure we fetch tags so our automatic versioning script picks up the version.
          fetch-tags: true

      - name: Set up MSVC (Windows only)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup emsdk
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: 'emsdk-cache'

      - name: Build and install
        uses: ./.github/actions/build-and-install
        with:
          host_profile: emscripten
          build_type: ${{ matrix.config.build_type }}
          configure_preset: ${{ matrix.config.preset_prefix }}-static
          build_preset: ${{ matrix.config.preset_prefix }}-static
          output_folder: build/wasm-${{ matrix.config.preset_prefix }}
          build_folder: build/wasm-${{ matrix.config.preset_prefix }}/build/${{ matrix.config.build_type }}
          install_prefix: install/wasm/${{ matrix.config.preset_prefix }}
          generate_sdk: ${{ matrix.linkage.name == 'static' && inputs.upload_install }}

      - name: Upload install
        if: inputs.upload_install
        uses: actions/upload-artifact@v4
        with:
          name: wasm-${{ matrix.config.preset_prefix }}-install
          path: install/wasm/${{ matrix.config.preset_prefix }}
          if-no-files-found: error